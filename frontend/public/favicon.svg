<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Athletic Electric Gradient -->
    <linearGradient id="sprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Clean dark badge background -->
  <rect width="512" height="512" rx="128" fill="#0A0E17"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#1E293B" stroke-width="2"/>

  <!-- Pure, bold, minimalist athletic 'S' mark -->
  <!-- Crisp geometric forward-leaning sprint chevrons -->
  <g transform="skewX(-15) translate(60, 0)">
    <!-- Top forward sprint blade / wing -->
    <path d="M 170 148 H 320 L 360 216 H 240 L 200 216 Z" fill="url(#sprintGrad)"/>
    
    <!-- Central fast link / kinetic bridge -->
    <path d="M 230 236 H 350 L 305 296 H 185 Z" fill="#FFFFFF"/>
    
    <!-- Bottom forward sprint thrust -->
    <path d="M 152 316 H 272 L 312 384 H 162 L 122 384 Z" fill="url(#sprintGrad)"/>
  </g>
</svg>